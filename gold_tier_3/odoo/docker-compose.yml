version: "3.8"

# Odoo 17 Community — Gold Tier AI Employee
# Start:  docker compose -f odoo/docker-compose.yml up -d
# Stop:   docker compose -f odoo/docker-compose.yml down
# Reset:  docker compose -f odoo/docker-compose.yml down -v

services:

  db:
    image: postgres:15-alpine
    container_name: odoo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       postgres
      POSTGRES_USER:     odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-odoo_gold_2024}
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - odoo_net

  odoo:
    image: odoo:17.0
    container_name: odoo_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
      - "${ODOO_LONGPOLL_PORT:-8072}:8072"
    environment:
      HOST:     db
      PORT:     5432
      USER:     odoo
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo_gold_2024}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    command: >
      odoo
      --config=/etc/odoo/odoo.conf
      --db_host=db
      --db_port=5432
      --db_user=odoo
      --db_password=${ODOO_DB_PASSWORD:-odoo_gold_2024}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8069/web/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - odoo_net

volumes:
  odoo_db_data:
  odoo_data:

networks:
  odoo_net:
    driver: bridge
